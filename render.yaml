services:
  - type: web
    name: eduanalytics-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: NODE_ENV=production node_modules/.bin/tsx server/index.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: eduanalytics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_URL
        value: https://scoreanalytics-coral.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://scoreanalytics-coral.vercel.app
      - key: LOG_LEVEL
        value: info
      - key: SEED_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: eduanalytics-db
    plan: starter
    region: oregon
    databaseName: eduanalytics
    user: eduanalytics
